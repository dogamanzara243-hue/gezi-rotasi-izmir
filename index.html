    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-12">
        <!-- Dynamic Search and Filter Section -->
        <div id="dynamic-search-filter-section" class="mb-6 max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">

                    <button data-filter="sea" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl transition-all">Manzara</button>
                    <button data-filter="museum" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl transition-all">Müze</button>
                </div>
            </div>

                <i class="fa-solid fa-monument text-[220px]"></i>
            </div>
            <div class="relative z-10 max-w-3xl">
                <div class="inline-flex items-center space-x-2 text-amber-400 text-sm font-semibold uppercase tracking-wider mb-2">
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="summary-badge-title"></span>
                </div>
                <h2 id="summary-type-title" class="text-2xl sm:text-3xl font-serif font-bold mb-4 text-white"></h2>
                <p id="summary-description" class="text-slate-300 text-base leading-relaxed mb-6 font-light"></p>
                <div id="summary-details" class="flex flex-wrap gap-3 text-xs font-medium pt-2 border-t border-white/10"></div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 space-y-4">
                <h2 id="overview-title" class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 flex items-center gap-3">
                    <span class="w-2 h-8 bg-theme rounded-full"></span>
                    <span></span>
                </h2>

        <section class="space-y-6">

        <section class="bg-slate-100/70 rounded-3xl p-6 sm:p-8 border border-slate-200/60 space-y-6">
            <h2 id="must-see-title" class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 flex items-center gap-3">
                <i class="fa-solid fa-star text-amber-500"></i>
                <span></span>
            </h2>
            <div id="must-see-items" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
                <div>
                    <h2 id="transport-title" class="text-2xl font-serif font-bold text-slate-900 mb-4 flex items-center gap-3">
                        <i class="fa-solid fa-route text-theme"></i>
                        <span></span>
                    </h2>
                    <div id="transport-methods" class="space-y-4 text-sm text-slate-600"></div>
                </div>
                <div class="mt-6 p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs leading-relaxed flex items-start space-x-3">
                    <i class="fa-solid fa-lightbulb text-amber-600 text-base mt-0.5"></i>
                    <div>
                        <strong>Ulaşım İpucu:</strong> <span id="transport-tip"></span>
                    </div>
                </div>
            </div>
            <div class="bg-slate-200 rounded-2xl min-h-[280px] relative overflow-hidden flex items-center justify-center border border-slate-300">
                <img id="map-bg-img" src="" alt="Harita Önizleme" loading="lazy" class="absolute inset-0 w-full h-full object-cover opacity-60">
                <div class="relative z-10 text-center p-4">
                    <a id="map-link" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 px-5 py-2.5 bg-theme hover:brightness-110 text-white rounded-xl font-medium shadow-lg transition-transform hover:scale-105">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span>Haritada Yol Tarifi Al</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="space-y-4">
                <h2 id="where-to-stay-title" class="text-2xl font-serif font-bold text-slate-900 flex items-center gap-3">
                    <i class="fa-solid fa-hotel text-theme"></i>
                    <span></span>
                </h2>
                <div id="hotel-list" class="space-y-3"></div>
            </div>
            <div class="space-y-4">
                <h2 id="where-to-eat-title" class="text-2xl font-serif font-bold text-slate-900 flex items-center gap-3">
                    <i class="fa-solid fa-utensils text-amber-600"></i>
                    <span></span>
                </h2>
                <div id="restaurant-list" class="space-y-3"></div>

    </main>

    <button id="back-to-top-btn" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-3.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 hover:scale-110 focus:outline-none" title="Yukarı Çık">
        <i class="fa-solid fa-arrow-up text-base"></i>
    </button>

    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-center text-sm mt-16">
        <div class="max-w-7xl mx-auto px-4">
            <p>© 2026 Akıllı Gezi Rehberi Projesi. GitHub Pages Uyumlu Modüler Şablon.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const topBtn = document.getElementById("back-to-top-btn");
        if(topBtn) {
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) {
                    topBtn.classList.remove("opacity-0", "pointer-events-none");
                    topBtn.classList.add("opacity-100");
                } else {
                    topBtn.classList.add("opacity-0", "pointer-events-none");
                    topBtn.classList.remove("opacity-100");
                }
            });
            topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
        }

        const searchInput = document.getElementById("destination-search-input");
        if(searchInput) {
            searchInput.addEventListener("input", (e) => {
                const query = e.target.value.toLowerCase();
                const cards = document.querySelectorAll("#why-visit-cards > div, #must-see-items > div, #hotel-list > div, #restaurant-list > div");
                cards.forEach(card => {
                    card.style.display = card.textContent.toLowerCase().includes(query) ? "" : "none";
                });
            });
        }
    });
    </script>
</body>
</html>
